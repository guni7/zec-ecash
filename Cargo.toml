[workspace]
resolver = "2"
members = ["crates/*"]

[workspace.dependencies]
# Cashu (mint side talks to stock cdk-mintd over gRPC)
cdk-common = "0.18.2"
cdk-payment-processor = { version = "0.18.2", default-features = false }
cdk = { version = "0.18.2", default-features = false, features = ["wallet"] }
cdk-redb = { version = "0.18.2", default-features = false, features = ["wallet"] }
# Zcash (one release train; pin orchard to what zcash_primitives uses).
# There is no separate "ironwood" feature: Ironwood (NU6.3) support is behind "orchard".
zcash_primitives = "0.30.1"
zcash_protocol = { version = "0.10.6", features = ["local-consensus"] }
# "unstable-frost": UnifiedFullViewingKey::from_orchard_fvk, for the FROST mint UFVK.
zcash_keys = { version = "0.16.1", features = ["orchard", "unstable-frost"] }
zcash_client_backend = { version = "0.24.0", features = ["orchard", "pczt", "sync", "lightwalletd-tonic", "lightwalletd-tonic-transport", "lightwalletd-tonic-tls-webpki-roots"] }
# "serde": AccountUuid must be serializable for PCZT creation/extraction (zec-wallet withdrawals).
zcash_client_sqlite = { version = "0.22.0", features = ["orchard", "multicore", "transparent-inputs", "serde"] }
pczt = { version = "0.9.3", features = ["orchard", "io-finalizer", "prover", "signer", "spend-finalizer", "tx-extractor"] }
orchard = "=0.15.5"
zcash_proofs = { version = "0.30.0", features = ["bundled-prover"] }   # same train as zcash_primitives 0.30 / sapling-crypto 0.7
secrecy = "0.8"   # SecretVec type used by zcash_client_sqlite 0.22
# Named in zec-wallet signatures; must match what zcash_client_sqlite / zcash_client_backend use.
rusqlite = "0.37"
tonic = { version = "0.14", features = ["tls-webpki-roots", "tls-ring"] }
zip32 = "0.2.1"   # must match what zcash_keys uses (0.3 causes an AccountId type mismatch)
# FROST over RedPallas
reddsa = { version = "0.5", features = ["frost"] }
# Same version reddsa uses; needed directly for rerandomized signing with a fixed alpha.
frost-rerandomized = "3.0.0"
# Runtime
tokio = { version = "1", features = ["full"] }
anyhow = "1"
rand = "0.8"
hex = "0.4"
async-trait = "0.1"
futures = "0.3"
pasta_curves = "0.5"
serde = { version = "1", features = ["derive"] }
# HTTP for the guardian protocol; versions already locked via tonic.
axum = "0.8"
hyper = { version = "1", features = ["client", "http1"] }
# Guardian transport: HMAC-SHA256 request auth and TLS (rustls with ring, as tonic uses).
sha2 = "0.10"
hmac = "0.12"
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12", "logging"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12", "logging"] }
webpki-roots = "1"
hyper-util = { version = "0.1", features = ["client-legacy", "http1", "tokio"] }
http-body-util = "0.1"
# Terminal QR codes for ecash tokens (zec-ecash-cli).
qrcode = { version = "0.14", default-features = false }
# Same bitreq CDK's HTTP client uses; the "-probe" feature makes it trust the OS store and
# SSL_CERT_FILE (e.g. mkcert's root), not only the built-in webpki roots.
bitreq = { version = "0.3", default-features = false, features = ["async-https-rustls-probe"] }
serde_json = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
